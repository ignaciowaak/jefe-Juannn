<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>La semana de Ignacio · Punto Bici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,620&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef2f1;
      --surface: #fffcf8;
      --ink: #1b2a33;
      --muted: #6d7874;
      --accent: #2c6b5c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
    }
    button { font: inherit; cursor: pointer; }
    .wrap { max-width: 32rem; margin: 0 auto; padding: 1.75rem 1rem 4rem; }
    .kicker { margin: 0; color: var(--accent); font-size: 0.75rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin: 0.45rem 0 0; font-family: Fraunces, Georgia, serif; font-size: 2.15rem; font-weight: 520; line-height: 1.08; }
    .lead { color: var(--muted); line-height: 1.55; font-size: 0.95rem; }
    .lead.ink { color: var(--ink); font-size: 1.02rem; }
    .sync { color: var(--muted); font-size: 0.75rem; }
    .err { color: var(--accent); font-size: 0.9rem; }
    .hero, .card { background: var(--surface); border-radius: 1.4rem; padding: 1rem 1rem 0.95rem; }
    .hero { margin-top: 1.15rem; }
    .eyebrow { margin: 0; color: var(--muted); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
    .hours-big { margin: 0.2rem 0 0; font-family: Fraunces, Georgia, serif; font-size: 2.35rem; font-weight: 520; font-variant-numeric: tabular-nums; }
    .split { margin-top: 0.85rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; border-top: 1px solid var(--bg); padding-top: 0.75rem; }
    .split p { margin: 0; }
    .split .lbl { color: var(--muted); font-size: 0.78rem; }
    .money { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
    .money .sym { opacity: 0.6; }
    .note { margin: 0.7rem 0 0; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
    .live {
      margin-top: 1.15rem; background: rgba(44, 107, 92, 0.1); color: var(--ink);
      border-radius: 1.4rem; padding: 1rem;
    }
    .live p { margin: 0.25rem 0 0; }
    .live .big { font-family: Fraunces, Georgia, serif; font-size: 1.85rem; font-weight: 520; font-variant-numeric: tabular-nums; }
    .live .sub { color: rgba(27, 42, 51, 0.78); font-size: 0.92rem; line-height: 1.45; }
    .formula { margin: 0.35rem 0 0; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.72rem; color: var(--muted); }
    .nav { margin-top: 1.4rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .round {
      width: 2.75rem; height: 2.75rem; border: 0; border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 1.3rem;
    }
    .round:disabled { opacity: 0.4; }
    .nav-title { text-align: center; }
    .nav-title p { margin: 0; font-family: Fraunces, Georgia, serif; font-size: 1.25rem; }
    .linkish { border: 0; background: none; color: var(--accent); font-weight: 500; padding: 0; }
    .strip { margin-top: 0.9rem; display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem; }
    .daychip {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 3.6rem; border-radius: 0.8rem; background: var(--surface); color: inherit; text-decoration: none;
    }
    .daychip small { color: var(--muted); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.04em; }
    .daychip b { font-family: Fraunces, Georgia, serif; font-size: 1.05rem; font-weight: 520; }
    .daychip i { width: 0.35rem; height: 0.35rem; margin-top: 0.2rem; border-radius: 99px; background: transparent; display: block; }
    .daychip.on i { background: var(--accent); }
    .daychip.today { background: var(--accent); color: var(--surface); }
    .daychip.today small { color: var(--surface); }
    .daychip.today i { background: var(--surface); }
    ul { list-style: none; margin: 0.9rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 0.7rem; }
    li { scroll-margin-top: 0.8rem; }
    .rowhead { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; font-weight: 500; }
    .hoy { color: var(--accent); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; }
    .shift { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid var(--bg); }
    .shift:first-of-type { margin-top: 0.45rem; padding-top: 0; border-top: 0; }
    .arrived { margin: 0; font-family: Fraunces, Georgia, serif; font-size: 1.55rem; font-weight: 520; font-variant-numeric: tabular-nums; }
    .left { margin: 0; font-family: Fraunces, Georgia, serif; font-size: 1.55rem; font-weight: 520; font-variant-numeric: tabular-nums; color: var(--muted); }
    .stay { margin: 0.45rem 0 0; font-size: 0.92rem; }
    .line { margin: 0.35rem 0 0; display: flex; justify-content: space-between; gap: 0.6rem; align-items: baseline; color: var(--muted); font-size: 0.88rem; }
    .open { color: var(--accent); }
    .empty { margin: 0.45rem 0 0; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="app" class="wrap"></div>
  <script>
    const DATA_URL = "https://the-pic-c437e-default-rtdb.firebaseio.com/punto_bici_ignacio.json";
    const DAY_SHORT = ["LUN", "MAR", "MIÉ", "JUE", "VIE", "SÁB", "DOM"];

    const state = {
      weekOffset: 0,
      records: {},
      liveShift: null,
      hourlyRate: 5000,
      error: "",
      updatedAt: null,
      now: Date.now()
    };

    function argentinaDateStr(date) {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Argentina/Buenos_Aires",
        year: "numeric", month: "2-digit", day: "2-digit"
      }).format(date || new Date());
    }

    function formatARS(amount) {
      return new Intl.NumberFormat("es-AR", {
        style: "currency", currency: "ARS", maximumFractionDigits: 0
      }).format(Math.round(Number(amount) || 0));
    }

    function formatHm(mins) {
      const m = Math.max(0, Math.round(Number(mins) || 0));
      return Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") + " min";
    }

    function cap(value) {
      if (!value) return "";
      return value.charAt(0).toUpperCase() + value.slice(1);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&" + "amp;")
        .replace(/</g, "&" + "lt;")
        .replace(/>/g, "&" + "gt;")
        .replace(/"/g, "&" + "quot;");
    }

    function weekBounds(weekOffset) {
      const today = argentinaDateStr();
      const parts = today.split("-").map(Number);
      const base = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], 12, 0, 0));
      const dow = base.getUTCDay();
      const diffToMonday = dow === 0 ? -6 : 1 - dow;
      base.setUTCDate(base.getUTCDate() + diffToMonday + weekOffset * 7);
      const days = [];
      for (let i = 0; i < 7; i++) {
        const cur = new Date(base.getTime());
        cur.setUTCDate(base.getUTCDate() + i);
        const iso = cur.getUTCFullYear() + "-" + String(cur.getUTCMonth() + 1).padStart(2, "0") + "-" + String(cur.getUTCDate()).padStart(2, "0");
        const month = cap(new Intl.DateTimeFormat("es-AR", {
          timeZone: "America/Argentina/Buenos_Aires", month: "short"
        }).format(cur)).replace(".", "");
        days.push({ iso: iso, short: DAY_SHORT[i], num: String(cur.getUTCDate()), month: month });
      }
      return { days: days, startIso: days[0].iso, endIso: days[6].iso };
    }

    function weekTitle(days) {
      if (days[0].month === days[6].month) return days[0].num + " al " + days[6].num + " de " + days[0].month;
      return days[0].num + " " + days[0].month + " al " + days[6].num + " " + days[6].month;
    }

    function isLive(shift) {
      return Boolean(shift && Number(shift.startTimestampMs) > 0 && shift.active !== false);
    }

    function buildView() {
      const week = weekBounds(state.weekOffset);
      const records = Object.values(state.records || {}).filter(function (r) { return r && r.date; });
      const live = isLive(state.liveShift) ? state.liveShift : null;
      let closedMinutes = 0;
      let closedAmount = 0;
      let pendingAmount = 0;
      let paidAmount = 0;
      const days = week.days.map(function (day) {
        const list = records.filter(function (r) { return r.date === day.iso; })
          .sort(function (a, b) { return String(a.startTime || "").localeCompare(String(b.startTime || "")); });
        const worked = list.filter(function (r) { return r.type !== "non_worked"; });
        const franco = list.find(function (r) { return r.type === "non_worked"; });
        const mins = worked.reduce(function (acc, r) { return acc + (Number(r.totalMinutes) || 0); }, 0);
        const amount = worked.reduce(function (acc, r) { return acc + (Number(r.totalAmount) || 0); }, 0);
        closedMinutes += mins;
        closedAmount += amount;
        worked.forEach(function (r) {
          const amt = Number(r.totalAmount) || 0;
          if (r.paidStatus === "paid") paidAmount += amt;
          else pendingAmount += amt;
        });
        return {
          iso: day.iso, short: day.short, num: day.num, month: day.month,
          worked: worked, franco: franco, openHere: Boolean(live && live.startDateStr === day.iso)
        };
      });
      let liveMinutes = 0;
      let liveAmount = 0;
      if (live && live.startDateStr >= week.startIso && live.startDateStr <= week.endIso) {
        liveMinutes = Math.max(0, Math.floor((state.now - Number(live.startTimestampMs)) / 60000));
        liveAmount = Math.round((liveMinutes / 60) * state.hourlyRate);
      }
      return {
        week: week, days: days, live: live,
        closedAmount: closedAmount, pendingAmount: pendingAmount, paidAmount: paidAmount,
        liveMinutes: liveMinutes, liveAmount: liveAmount,
        totalAmount: closedAmount + liveAmount,
        totalMinutes: closedMinutes + liveMinutes
      };
    }

    function quietMoney(amount) {
      const text = formatARS(amount);
      const cut = text.search(/\d/);
      if (cut < 0) return '<span class="money">' + escapeHtml(text) + "</span>";
      return '<span class="money"><span class="sym">' + escapeHtml(text.slice(0, cut)) + "</span>" + escapeHtml(text.slice(cut)) + "</span>";
    }

    function weekSentence(view) {
      if (view.totalMinutes <= 0) return "En esta semana todavía no hay horarios.";
      let note = "Esta semana estuvo " + formatHm(view.totalMinutes) + " en el local. Con la hora convenida, la cuenta da " + formatARS(view.totalAmount) + ".";
      if (view.liveAmount > 0) {
        note += " " + formatARS(view.closedAmount) + " es de días ya cerrados y " + formatARS(view.liveAmount) + " es de hoy, que sigue abierto.";
      }
      if (view.paidAmount > 0) note += " Ya quedó liquidado " + formatARS(view.paidAmount) + ".";
      const closedLeft = Math.max(0, view.closedAmount - view.paidAmount);
      if (view.paidAmount > 0 && closedLeft > 0) note += " El resto de los días cerrados suma " + formatARS(closedLeft) + ".";
      return note;
    }

    function renderApp() {
      const view = buildView();
      const today = argentinaDateStr();
      const updated = state.updatedAt == null
        ? "Actualizando…"
        : "Se actualizó solo · hace " + Math.max(0, Math.round((state.now - state.updatedAt) / 1000)) + " s";
      const note = weekSentence(view);

      let liveHtml = "";
      if (view.live) {
        const elapsed = Math.max(0, Math.floor((state.now - Number(view.live.startTimestampMs)) / 60000));
        const money = Math.round((elapsed / 60) * state.hourlyRate);
        const fecha = String(view.live.startDateStr || "").split("-").reverse().join("/");
        liveHtml = '<div class="live"><p class="kicker">Hoy está en el local</p>' +
          '<p class="big">Llegó a las ' + escapeHtml(view.live.startTimeStr || "--:--") + "</p>" +
          '<p class="sub" id="liveStay">Sigue ahí, desde el ' + escapeHtml(fecha) + ". Van " + formatHm(elapsed) + ".</p>" +
          '<p class="formula" id="liveFormula">' + elapsed + " min × " + escapeHtml(formatARS(state.hourlyRate)) + " / 60</p>" +
          '<p class="sub">La cuenta de hoy, por ahora, <span id="livePay">' + quietMoney(money) + "</span></p></div>";
      }

      const chips = view.days.map(function (day) {
        const marked = day.worked.length > 0 || day.openHere || day.franco;
        const cls = "daychip" + (day.iso === today ? " today" : "") + (marked ? " on" : "");
        return '<a class="' + cls + '" href="#dia-' + day.iso + '"><small>' + day.short + "</small><b>" + day.num + "</b><i></i></a>";
      }).join("");

      const list = view.days.map(function (day) {
        let body = "";
        if (day.worked.length === 0 && !day.franco && !day.openHere) {
          body += '<p class="empty">Ese día no estuvo.</p>';
        }
        if (day.franco && day.worked.length === 0) {
          body += '<p class="empty" style="color:var(--ink)">No estuvo · ' + escapeHtml(day.franco.reason || "franco") + "</p>";
        }
        day.worked.forEach(function (rec) {
          const mins = Number(rec.totalMinutes) || 0;
          const rate = Number(rec.hourlyRate) || state.hourlyRate;
          body += '<div class="shift"><p class="arrived">Llegó ' + escapeHtml(rec.startTime || "--:--") + "</p>" +
            '<p class="left">Se fue ' + escapeHtml(rec.endTime || "--:--") + "</p>" +
            '<p class="stay">' + escapeHtml(rec.durationLabel || formatHm(mins)) + " en el local" +
            (Number(rec.breakMinutes) > 0 ? " · " + rec.breakMinutes + " min de descanso" : "") + "</p>" +
            '<p class="formula">' + mins + " min × " + escapeHtml(formatARS(rate)) + " / 60</p>" +
            '<p class="line"><span>' + (rec.paidStatus === "paid" ? "Ya liquidado" : "Cuenta del día") + "</span>" + quietMoney(rec.totalAmount) + "</p></div>";
        });
        if (day.openHere && view.live) {
          body += '<div class="shift"><p class="arrived">Llegó ' + escapeHtml(view.live.startTimeStr || "--:--") + "</p>" +
            '<p class="left open">Sigue en el local</p>' +
            '<p class="stay" id="liveDayStay">' + formatHm(view.liveMinutes) + ", y sigue</p>" +
            '<p class="formula" id="liveDayFormula">' + view.liveMinutes + " min × " + escapeHtml(formatARS(state.hourlyRate)) + " / 60</p>" +
            '<p class="line"><span>Cuenta de hoy, por ahora</span><span id="liveDayPay">' + quietMoney(view.liveAmount) + "</span></p></div>";
        }
        return '<li class="card" id="dia-' + day.iso + '"><div class="rowhead"><p>' + day.short + " " + day.num + " " + day.month + "</p>" +
          (day.iso === today ? '<span class="hoy">Hoy</span>' : "") + "</div>" + body + "</li>";
      }).join("");

      const back = state.weekOffset !== 0
        ? '<button type="button" class="linkish" id="btnThisWeek">Volver a esta semana</button>'
        : '<p class="sync" style="margin:0">Esta semana</p>';

      document.getElementById("app").innerHTML =
        '<header><p class="kicker">Punto Bici</p><h1>La semana de Ignacio</h1>' +
        '<p class="lead ink">Juan, acá está cada horario: a qué hora llegó, a qué hora se fue y cuánto tiempo estuvo en el local.</p>' +
        '<p class="lead">La hora convenida son ' + formatARS(state.hourlyRate) + '. La cuenta de cada día sale sola de esos minutos por esa hora. No hay otro número.</p>' +
        '<p class="sync" id="syncLabel" style="margin-top:0.7rem">' + updated + "</p></header>" +
        liveHtml +
        '<section class="hero">' +
          '<p class="eyebrow">En el local, esta semana</p>' +
          '<p class="hours-big" id="weekHours">' + formatHm(view.totalMinutes) + "</p>" +
          '<div class="split"><div><p class="lbl">Hora convenida</p><p>' + quietMoney(state.hourlyRate) + "</p></div>" +
          '<div><p class="lbl">Cuenta de esas horas</p><p id="weekPay">' + quietMoney(view.totalAmount) + "</p></div></div>" +
        "</section>" +
        '<p class="note" id="weekNote">' + note + "</p>" +
        (state.error ? '<p class="err">' + escapeHtml(state.error) + "</p>" : "") +
        liveHtml +
        '<div class="nav"><button type="button" class="round" id="btnPrev" aria-label="Semana anterior">‹</button>' +
          '<div class="nav-title"><p>' + weekTitle(view.week.days) + "</p>" + back + "</div>" +
          '<button type="button" class="round" id="btnNext" aria-label="Semana siguiente"' + (state.weekOffset >= 0 ? " disabled" : "") + ">›</button></div>" +
        '<div class="strip">' + chips + "</div><ul>" + list + "</ul>";

      document.getElementById("btnPrev").onclick = function () { state.weekOffset -= 1; renderApp(); };
      document.getElementById("btnNext").onclick = function () {
        state.weekOffset = Math.min(0, state.weekOffset + 1);
        renderApp();
      };
      const backBtn = document.getElementById("btnThisWeek");
      if (backBtn) backBtn.onclick = function () { state.weekOffset = 0; renderApp(); };
    }

    let lastSnapshot = "";

    async function loadData() {
      try {
        const res = await fetch(DATA_URL);
        if (!res.ok) throw new Error("bad");
        const data = await res.json();
        state.records = data && data.records && typeof data.records === "object" ? data.records : {};
        state.liveShift = data && data.live_shift ? data.live_shift : null;
        state.hourlyRate = Number(data && data.settings && data.settings.hourlyRate) || 5000;
        state.error = "";
        state.updatedAt = Date.now();
        const snap = JSON.stringify({
          records: state.records,
          live: state.liveShift,
          rate: state.hourlyRate
        });
        const changed = snap !== lastSnapshot;
        lastSnapshot = snap;
        if (changed || !document.getElementById("weekHours")) renderApp();
      } catch (e) {
        state.error = "No se pudieron leer los horarios. Reintentá en un momento.";
        if (!document.getElementById("weekHours")) renderApp();
        else {
          const err = document.querySelector(".err");
          if (!err) renderApp();
        }
      }
    }

    function boot() {
      renderApp();
      loadData();
    }

    function tickLive() {
      state.now = Date.now();
      const view = buildView();
      const hours = document.getElementById("weekHours");
      const pay = document.getElementById("weekPay");
      const sync = document.getElementById("syncLabel");
      const note = document.getElementById("weekNote");
      if (hours) hours.textContent = formatHm(view.totalMinutes);
      if (pay) pay.innerHTML = quietMoney(view.totalAmount);
      if (sync && state.updatedAt) {
        sync.textContent = "Se actualizó solo · hace " + Math.max(0, Math.round((state.now - state.updatedAt) / 1000)) + " s";
      }
      if (note) note.textContent = weekSentence(view);
      if (view.live) {
        const elapsed = Math.max(0, Math.floor((state.now - Number(view.live.startTimestampMs)) / 60000));
        const money = Math.round((elapsed / 60) * state.hourlyRate);
        const fecha = String(view.live.startDateStr || "").split("-").reverse().join("/");
        const stay = document.getElementById("liveStay");
        const formula = document.getElementById("liveFormula");
        const livePay = document.getElementById("livePay");
        if (stay) stay.textContent = "Sigue ahí, desde el " + fecha + ". Van " + formatHm(elapsed) + ".";
        if (formula) formula.textContent = elapsed + " min × " + formatARS(state.hourlyRate) + " / 60";
        if (livePay) livePay.innerHTML = quietMoney(money);
      }
      const dayStay = document.getElementById("liveDayStay");
      const dayFormula = document.getElementById("liveDayFormula");
      const dayPay = document.getElementById("liveDayPay");
      if (dayStay) dayStay.textContent = formatHm(view.liveMinutes) + ", y sigue";
      if (dayFormula) dayFormula.textContent = view.liveMinutes + " min × " + formatARS(state.hourlyRate) + " / 60";
      if (dayPay) dayPay.innerHTML = quietMoney(view.liveAmount);
    }

    boot();
    setInterval(tickLive, 1000);
    setInterval(loadData, 12000);
  </script>
</body>
</html>
